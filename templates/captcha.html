<div class="{{ property.captchaClass }}" data-sitekey="{{ property.sitekey }}" {%if property.callback %}
    data-callback="{{ property.callback }}" {%endif%} {%if property.expiredCallback %}
    data-expired-callback="{{ property.expiredCallback }}" {%endif%}></div>

{% if property.captchaType == "h-captcha" %}
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
{%elif property.captchaType == "re-captcha" %}
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
{%elif property.captchaType == "turnstile" %}
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{%endif%}
