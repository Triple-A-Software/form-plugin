{% if property.variant == "solid" %}
<button type="{{ property.type }}" class="
    focus:outline-none
    text-whitr
    bg-{{property.common.color}}-700
    hover:bg-{{property.common.color}}-800
    focus:ring-4
    focus:ring-{{property.common.color}}-300
    font-medium
    rounded-lg
    text-sm
    px-5
    py-2.5
    me-2
    mb-2
    dark:bg-{{property.common.color}}-600
    dark:hover:bg-{{property.common.color}}-700
    dark:focus:ring-{{property.common.color}}-800">
    {{ property.common.label[language] }}
</button>
{% elif property.variant == "alternative" %}
<button type="{{ property.type }}" class="
    py-2.5
    px-5
    me-2
    mb-2
    text-sm
    font-medium
    text-{{ property.common.color }}-900
    focus:outline-none
    bg-white
    rounded-lg
    border
    border-{{ property.common.color }}-200
    hover:bg-{{ property.common.color }}-100
    hover:text-{{ property.common.color }}-700
    focus:z-10
    focus:ring-4
    focus:ring-{{ property.common.color }}-100
    dark:focus:ring-{{ property.common.color }}-700
    dark:bg-{{ property.common.color }}-800
    dark:text-{{ property.common.color }}-400
    dark:border-{{ property.common.color }}-600
    dark:hover:text-white
    dark:hover:bg-{{ property.common.color }}-700">
    {{ property.common.label[language] }}
</button>
{% endif %}
