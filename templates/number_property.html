<div {% if property.common.class %} class="{{ property.common.class }}" {%endif%}>
    <label for="{{ property.common.name }}" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
        {{ property.common.label[language] }}
        {% if property.common.required %} <span>*</span> {% endif %}
    </label>
    <input type="number" {% if property.max %} max="{{ property.max }}" {%endif%} {% if property.min %}
        min="{{ property.min }}" {%endif%} id="{{ property.common.name }}" {% if property.step %}
        step="{{ property.step }}" {%endif%}
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-{{ property.common.color }}-500 focus:border-{{ property.common.color }}-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-{{ property.common.color }}-500 dark:focus:border-{{ property.common.color }}-500"
        {% if property.placeholder[language] %} placeholder="{{ property.placeholder[language] }}" {%endif%} {% if
        property.common.default_value %} value="{{property.common.default_value}}" {%endif%} {% if
        property.common.required %} required {%endif%} />
</div>
