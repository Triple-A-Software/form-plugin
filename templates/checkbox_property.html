<div class="flex items-center">
    <input {% if property.default_value %}checked{% endif %} type="checkbox" id="{{ property.name }}"
        name="{{ property.name }}"
        class="w-4 h-4 text-{{ property.color }}-600 bg-gray-100 border-gray-300 rounded-sm focus:ring-{{ property.color }}-500 dark:focus:ring-{{ property.color }}-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
    <div class="ms-2 text-sm">
        <label for="{{ property.name }}" class="font-medium text-gray-900 dark:text-gray-300">
            {{ property.label[language] }}
            {% if property.required %} <span>*</span> {% endif %}
        </label>
        <p class="text-xs font-normal text-gray-500 dark:text-gray-300">
            {{ property.hint[language] }}
        </p>
    </div>
</div>
