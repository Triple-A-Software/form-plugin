<label for="{{ property.name }}" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
    {{ property.label[language] }}
</label>
<textarea id="{{ property.name }}" {% if property.rows %} rows="{{ property.rows }}" {% endif %} {% if
    property.max_length %} maxlength="{{ property.max_length }}" {% endif %}
    class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-{{ property.color }}-500 focus:border-{{ property.color }}-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-{{ property.color }}-500 dark:focus:border-{{ property.color }}-500"
    {% if property.placeholder[language] %} placeholder="{{ property.placeholder[placeholder] }}" {%endif%}>
    {{ property.default_value }}
</textarea>
