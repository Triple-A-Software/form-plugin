<div {% if property.class %} class="{{ property.class }}" {%endif%}>
    <label
        for="{{ property.name }}"
        class="block mb-2 font-medium text-gray-900 dark:text-white text-sm {{ property.label_class }}"
    >
        {{ property.label[language] }}
    </label>
    <textarea
        id="{{ property.name }}"
        name="{{ property.name }}"
        {% if property.rows %} rows="{{ property.rows }}" {% endif %}
        {% if property.max_length %} maxlength="{{ property.max_length }}" {% endif %}
        {% if property.input_class %}class="{{ property.input_class }}"{%endif%}
        {% if property.placeholder[language] %}
            placeholder="{{ property.placeholder[language] }}"
        {%endif%}
    >{%if property.default_value %}{{ property.default_value }}{%endif%}</textarea>
</div>
