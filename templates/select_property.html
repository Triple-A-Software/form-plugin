<div class="max-w-sm mx-auto {{ property.common.class }}">
    <label for="{{ property.common.name }}" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
        {{ property.common.label[language] }}
    </label>
    <select id="{{ property.common.name }}" name="{{ property.common.name }}"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-{{ property.common.color }}-500 focus:border-{{ property.common.color }}-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-{{ property.common.color }}-500 dark:focus:border-{{ property.common.color }}-500">
        {% for item in property.options %}
        <option value="{{ item.value }}" {%if property.common.default_value==item.value %} selected {%endif%}>
            {{ item.label[language] }}
        </option>
        {% endfor %}
    </select>
</div>
