[package]
name = "form-plugin"
version = "3.0.5"
edition = "2024"

[workspace]
members = ["seed"]

default-run = "form-plugin"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono"] }
tera = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["normalize-path", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ts-rs = { version = "10", features = ["serde-json-impl", "no-serde-warnings"] }

fake = { version = "4", features = [
    "derive",
    "serde_json",
    "chrono",
], optional = true }

[features]
seed = ["dep:fake"]
