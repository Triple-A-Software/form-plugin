[package]
name = "form-plugin"
version = "4.0.0"
edition = "2024"

[workspace]
members = ["seed"]

[dependencies]
anyhow = "1"
async-tempfile = "0.7"
async_zip = { version = "0.0.18", features = ["deflate", "tokio-fs", "tokio"] }
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
futures = "0.3"
reqwest = { version = "0.13", features = ["json", "form", "native-tls-vendored", "http2", "charset", "system-proxy" ], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio",
    "chrono",
    "uuid",
] }
thiserror = "2"
minijinja = { version = "2", features = ["loader"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["normalize-path", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ts-rs = { version = "11", features = [
    "serde-json-impl",
    "no-serde-warnings",
    "uuid-impl",
] }
uuid = { version = "1", features = ["v4", "serde"] }

fake = { version = "4", features = [
    "derive",
    "serde_json",
    "uuid",
    "chrono",
], optional = true }

[features]
seed = ["dep:fake"]
